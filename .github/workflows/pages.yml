name: Publish GitHub website and mobile PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'scripts/release-pages.mjs'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: localdesk-pages
  cancel-in-progress: true

jobs:
  website:
    if: github.repository == 'solomongs/LocalDesk-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/release-pages.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-website
          path: web-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Check whether Pages is configured
        id: pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`, {headers:{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=false\n');
            console.log('::notice::Website artifact is ready. To publish GitHub Pages, choose GitHub Actions in repository Settings > Pages, then rerun this workflow.');
          } else if (!response.ok) {
            throw new Error(`Pages configuration check failed: HTTP ${response.status}`);
          } else {
            const pages = await response.json();
            const enabled = pages.build_type === 'workflow';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
            if (!enabled) console.log('::notice::Set Settings > Pages > Source to GitHub Actions, then rerun this workflow.');
          }
          JS
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web-dist/
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
